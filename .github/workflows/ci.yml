name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run mypy
        run: make mypy

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker compose build api

      - name: Run backend lint
        run: docker compose run --rm --no-deps api ruff check app tests

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

  frontend-tests:
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build

  backend-integration-tests:
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-unit-tests]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start backend dependencies
        run: docker compose up -d --build postgres redis api

      - name: Run migrations
        run: docker compose run --rm api alembic upgrade head

      - name: Seed baseline packages
        run: docker compose run --rm api python -m app.cli seed --packages flask django requests

      - name: Run backend integration tests
        run: docker compose run --rm api pytest tests/integration

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Teardown
        if: always()
        run: docker compose down --remove-orphans

  backend-unit-tests:
    runs-on: ubuntu-latest
    needs: [backend-lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker compose build api

      - name: Run backend unit tests
        run: docker compose run --rm --no-deps api pytest tests/unit

  migrations:
    runs-on: ubuntu-latest
    needs: [backend-lint]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start postgres
        run: docker compose up -d --wait postgres

      - name: Migrations on synthetic data (base -> head -> downgrade -> head)
        run: ./scripts/check_migrations.sh

      - name: Teardown
        if: always()
        run: docker compose down --remove-orphans

  acceptance-smoke:
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-integration-tests]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start API stack
        run: docker compose up -d --build postgres redis api worker

      - name: Run migrations
        run: docker compose run --rm api alembic upgrade head

      - name: Seed baseline packages
        run: docker compose run --rm api python -m app.cli seed --packages flask django requests

      - name: Run acceptance smoke
        run: ./scripts/acceptance_smoke.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Teardown
        if: always()
        run: docker compose down --remove-orphans
