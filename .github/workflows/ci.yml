name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run mypy
        run: make mypy

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker compose build api

      - name: Run backend lint
        run: docker compose run --rm --no-deps api ruff check app tests

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

  frontend-tests:
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build

  rpm-worker-tests:
    # libsolv and libmodulemd exist only in the worker's Rocky Linux image: its tests run there.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the rpm-worker image
        run: docker build -t packagehub-rpm-worker:ci rpm_worker

      - name: Run rpm-worker tests
        run: docker run --rm --network none packagehub-rpm-worker:ci python3 -m pytest -q tests

  backend-integration-tests:
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-unit-tests]
    timeout-minutes: 25
    env:
      # Upstream sources come from recorded responses (scripts/record_fixtures.sh); live runs are in nightly.yml.
      HTTP_REPLAY_DIR: /app/tests/fixtures/http
    defaults:
      run:
        shell: bash  # -eo pipefail, so `| tee` keeps the step's exit code
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start backend dependencies
        # rpm-worker answers the RPM tasks from the same replay fixtures (SPEC §3.2).
        run: docker compose up -d --build postgres redis api rpm-worker

      - name: Run migrations
        run: docker compose run --rm api alembic upgrade head

      - name: Seed baseline packages
        run: docker compose run --rm api python -m app.cli seed --packages flask django requests 2>&1 | tee -a "$RUNNER_TEMP/run.log"

      - name: Run backend integration tests
        run: docker compose run --rm api pytest tests/integration 2>&1 | tee -a "$RUNNER_TEMP/run.log"

      - name: Fail on replay misses
        # A request missing from the fixtures is swallowed by callers (seed counts it as a sync failure),
        # so look for the transport's log line instead of trusting green steps.
        run: |
          if docker compose logs --no-color | cat - "$RUNNER_TEMP/run.log" | grep REPLAY_MISS; then
            echo "Requests without recorded responses; re-record with scripts/record_fixtures.sh" >&2
            exit 1
          fi

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Teardown
        if: always()
        run: docker compose down --remove-orphans

  backend-unit-tests:
    runs-on: ubuntu-latest
    needs: [backend-lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker compose build api

      - name: Run backend unit tests
        run: docker compose run --rm --no-deps api pytest tests/unit

  migrations:
    runs-on: ubuntu-latest
    needs: [backend-lint]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Migrations on synthetic data (base -> head -> downgrade -> head)
        # The script runs and removes its own compose project.
        run: ./scripts/check_migrations.sh

  acceptance-smoke:
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-integration-tests]
    timeout-minutes: 25
    env:
      # Upstream sources come from recorded responses (scripts/record_fixtures.sh); live runs are in nightly.yml.
      HTTP_REPLAY_DIR: /app/tests/fixtures/http
    defaults:
      run:
        shell: bash  # -eo pipefail, so `| tee` keeps the step's exit code
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start API stack
        run: docker compose up -d --build postgres redis api worker

      - name: Run migrations
        run: docker compose run --rm api alembic upgrade head

      - name: Seed baseline packages
        run: docker compose run --rm api python -m app.cli seed --packages flask django requests 2>&1 | tee -a "$RUNNER_TEMP/run.log"

      - name: Run acceptance smoke
        run: ./scripts/acceptance_smoke.sh 2>&1 | tee -a "$RUNNER_TEMP/run.log"

      - name: Fail on replay misses
        # A request missing from the fixtures is swallowed by callers (seed counts it as a sync failure),
        # so look for the transport's log line instead of trusting green steps.
        run: |
          if docker compose logs --no-color | cat - "$RUNNER_TEMP/run.log" | grep REPLAY_MISS; then
            echo "Requests without recorded responses; re-record with scripts/record_fixtures.sh" >&2
            exit 1
          fi

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Teardown
        if: always()
        run: docker compose down --remove-orphans
