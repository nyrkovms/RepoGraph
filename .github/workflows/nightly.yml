name: Nightly live

# The same integration + smoke flow as CI, but against the live upstream sources (no HTTP_REPLAY_DIR).
# It catches upstream format changes that the recorded fixtures cannot see.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  live-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start backend dependencies
        # rpm-worker reads the frozen vault snapshots of the RPM resolver references live.
        run: docker compose up -d --build postgres redis api rpm-worker

      - name: Run migrations
        run: docker compose run --rm api alembic upgrade head

      - name: Seed baseline packages
        run: docker compose run --rm api python -m app.cli seed --packages flask django requests

      - name: Run backend integration tests
        run: docker compose run --rm -e RPM_REFERENCES=1 api pytest tests/integration

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Teardown
        if: always()
        run: docker compose down --remove-orphans

  live-acceptance-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start API stack
        run: docker compose up -d --build postgres redis api worker

      - name: Run migrations
        run: docker compose run --rm api alembic upgrade head

      - name: Seed baseline packages
        run: docker compose run --rm api python -m app.cli seed --packages flask django requests

      - name: Run acceptance smoke
        run: ./scripts/acceptance_smoke.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Teardown
        if: always()
        run: docker compose down --remove-orphans
