[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "packagehub-backend"
version = "0.1.0"
description = "PackageHub MVP backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "tzdata>=2024.1",
  "sqlalchemy[asyncio]>=2.0.38",
  "asyncpg>=0.30.0",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.16.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "celery>=5.5.0",
  "redis>=6.4.0",
  "httpx>=0.28.0",
  "packaging>=24.0",
  "resolvelib>=1.1.0",
  "prometheus-client>=0.22.0",
  "pyyaml>=6"
]

[project.optional-dependencies]
test = [
  "pytest==9.2.0"
]
lint = [
  "ruff==0.17.3"
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E9", "F",      # syntax errors, undefined and unused names
    "B",            # likely bugs
    "BLE",          # a blind `except Exception` says why with `noqa: BLE001`
    "ASYNC",        # blocking calls in async code
    "S",            # security (application code only, see per-file-ignores)
    "DTZ",          # naive datetimes
    "C90",          # complexity, capped at what exists today so it does not grow
    "I", "UP", "SIM", "C4", "PERF", "RUF", "T20",
]
ignore = [
    "UP042",        # StrEnum: str() of the member changes from "Class.member" to its value
    "ASYNC109",     # a `timeout` argument is how these coroutines bound their own work
    "SIM114",       # branches with the same body stay apart when they say different things
    "SIM108",       # an if/else block reads better than a nested conditional expression
    "PERF401",      # a loop with a condition reads better than extend() over a generator
    "S101",         # asserts state invariants for the type checker; nothing relies on them at run time
]

[tool.ruff.lint.mccabe]
max-complexity = 26

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters by calling these in defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]   # asserts, fixture secrets and subprocess are what tests are made of
"app/cli.py" = ["T20"]   # printing is the command line's output
"app/config.py" = ["S104", "S105"]   # local development defaults, overridden by the environment

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true

# The whole application is type-checked; the plugin layer and its contract strictly (`--strict`'s per-module
# flags, so one run checks everything).
[[tool.mypy.overrides]]
module = ["app.ecosystems", "app.ecosystems.*", "ecosystem_contract"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["celery.*", "resolvelib.*", "yaml"]
ignore_missing_imports = true
