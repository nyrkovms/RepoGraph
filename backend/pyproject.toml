[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "packagehub-backend"
version = "0.1.0"
description = "PackageHub MVP backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "tzdata>=2024.1",
  "sqlalchemy[asyncio]>=2.0.38",
  "asyncpg>=0.30.0",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.16.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "celery>=5.5.0",
  "redis>=6.4.0",
  "httpx>=0.28.0",
  "packaging>=24.0",
  "resolvelib>=1.1.0",
  "prometheus-client>=0.22.0"
]

[project.optional-dependencies]
test = [
  "pytest==9.2.0"
]
lint = [
  "ruff==0.17.3"
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F"]

[tool.mypy]
python_version = "3.12"

# Strict typing is enforced for the plugin layer only; legacy modules it imports are not checked (yet).
[[tool.mypy.overrides]]
module = ["app.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["app.ecosystems", "app.ecosystems.*"]
ignore_errors = false

[[tool.mypy.overrides]]
module = ["celery.*", "resolvelib.*", "kombu.*"]
ignore_missing_imports = true
