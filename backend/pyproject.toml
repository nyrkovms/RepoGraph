[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "packagehub-backend"
version = "0.1.0"
description = "PackageHub MVP backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "tzdata>=2024.1",
  "sqlalchemy[asyncio]>=2.0.38",
  "asyncpg>=0.30.0",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.16.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "celery>=5.5.0",
  "redis>=6.4.0",
  "httpx>=0.28.0",
  "packaging>=24.0",
  "resolvelib>=1.1.0",
  "prometheus-client>=0.22.0",
  "pyyaml>=6"
]

[project.optional-dependencies]
test = [
  "pytest==9.2.0"
]
lint = [
  "ruff==0.17.3"
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true

# The whole application is type-checked; the plugin layer and its contract strictly (`--strict`'s per-module
# flags, so one run checks everything).
[[tool.mypy.overrides]]
module = ["app.ecosystems", "app.ecosystems.*", "ecosystem_contract"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["celery.*", "resolvelib.*", "yaml"]
ignore_missing_imports = true
