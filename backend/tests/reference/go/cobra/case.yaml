description: >
  cobra 1.8 (go 1.15): below go 1.17 the graph is not pruned, every go.mod is read.
roots:
  - {purl: "pkg:golang/github.com/spf13/cobra@v1.8.0", constraint: "v1.8.0"}
environment: {go_version: "1.23"}
sources:
  - {slug: proxy-golang-org, protocol: goproxy, base_url: "https://proxy.golang.org/", priority: 0}
native:
  platform: linux/amd64
allowed_differences: []
