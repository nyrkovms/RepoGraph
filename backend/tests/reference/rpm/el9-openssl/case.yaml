description: >
  openssl on Rocky Linux 9.4 (frozen vault snapshot): libraries by capability, /bin/sh by file, weak dependencies on.
roots:
  - {purl: "pkg:rpm/rocky/openssl?distro=rocky-9", constraint: "*"}
environment: {distro: rocky-9, arch: x86_64}
sources:
  - {slug: vault-rocky-9.4-baseos, protocol: rpm-repodata, base_url: "https://dl.rockylinux.org/vault/rocky/9.4/BaseOS/$basearch/os/", priority: 10,
     config: {namespace: rocky-9, vendor: rocky, arch: [x86_64], releasever: "9"}}
  - {slug: vault-rocky-9.4-appstream, protocol: rpm-repodata, base_url: "https://dl.rockylinux.org/vault/rocky/9.4/AppStream/$basearch/os/", priority: 20,
     config: {namespace: rocky-9, vendor: rocky, arch: [x86_64], releasever: "9", modular: true}}
native: {platform: linux/amd64, image: "rockylinux:9"}
allowed_differences: []
